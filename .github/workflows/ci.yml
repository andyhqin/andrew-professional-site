name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Installs the private @andyhqin packages from GitHub Packages, read by
      # .npmrc. A repository secret holding a classic token with only
      # read:packages (secret names can't start with GITHUB_).
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      # Any valid address will do for a build in CI; the real one is set on Netlify.
      SITE_URL: https://andrew-qin.netlify.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
