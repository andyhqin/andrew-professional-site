name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Installs the private @andyhqin packages from GitHub Packages. Each package
  # must grant this repository read access (package settings, "Manage Actions
  # access"), or the install is refused.
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Any valid address will do for a build in CI; the real one is set on Netlify.
      SITE_URL: https://andrew-qin.netlify.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
